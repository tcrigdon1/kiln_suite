<div id="app">
  <div class="menubar" id="menubar"></div>
  <div id="workspace">
    <div id="leftcol">
      <div id="toprow">
        <section class="panel" id="p-bin"></section>

        <section class="panel" id="p-source"></section>
        <div class="split-v" data-split="source"></div>
        <section class="panel" id="p-program"></section>
      </div>
      <div class="split-h" data-split="top"></div>
      <section class="panel" id="p-timeline"></section>
    </div>
    <div class="split-v" data-split="right"></div>
    <section class="panel" id="p-right"></section>
  </div>
  <div class="statusbar" id="statusbar"></div>
</div>
